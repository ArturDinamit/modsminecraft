
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b111b">
<title>MineMods | Minecraft Bedrock</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0b111b;
  --text: #f5f7ff;
  --muted: #9aa7b9;
  --accent: #53df96;
  --card: rgba(255,255,255,.065);
  --border: rgba(255,255,255,.15);
}

body.light {
  --bg: #edf2fa;
  --text: #172232;
  --muted: #65738a;
  --accent: #168d58;
  --card: rgba(255,255,255,.55);
  --border: rgba(60,80,110,.15);
}

body {
  margin: 0;
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  transition: background .35s, color .35s;
  overflow-x: hidden;
}

.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(95px);
  pointer-events: none;
  z-index: -1;
}

.glow.one {
  width: 280px;
  height: 280px;
  top: -130px;
  right: -90px;
  background: rgba(54,224,136,.25);
}

.glow.two {
  width: 250px;
  height: 250px;
  bottom: 70px;
  left: -130px;
  background: rgba(74,124,255,.16);
}

header {
  padding: 30px 24px 12px;
  max-width: 900px;
  margin: auto;
}

.logo {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span {
  color: var(--accent);
}

.subtitle {
  margin-top: 7px;
  font-size: 13px;
  color: var(--muted);
}

/* Кнопка скачивания Minecraft */
.download-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 10px 22px 0;
}

.download-minecraft {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  width: 100%;
  padding: 16px;
  border-radius: 20px;

  background: linear-gradient(
    135deg,
    rgba(70,220,130,.30),
    rgba(70,220,130,.08)
  );

  border: 1px solid rgba(100,255,170,.35);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  box-shadow:
    0 7px 25px rgba(0,0,0,.12),
    inset 0 1px 1px rgba(255,255,255,.3);

  color: var(--text);
  text-decoration: none;
  font-weight: bold;
  font-size: 15px;

  transition: transform .25s, box-shadow .25s;
}

.download-minecraft:hover {
  box-shadow:
    0 8px 30px rgba(60,220,130,.18),
    inset 0 1px 1px rgba(255,255,255,.4);
}

.download-minecraft:active {
  transform: scale(.97);
}

.download-icon {
  font-size: 22px;
  line-height: 1;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 20px 22px 115px;
}

h1 {
  font-size: 29px;
  margin: 10px 0 25px;
}

.page {
  display: none;
}

.page.active {
  display: block;
  animation: fadeIn .3s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.empty {
  min-height: 290px;
  border-radius: 26px;
  border: 1px solid var(--border);
  background: var(--card);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 25px;
}

.empty-icon {
  width: 78px;
  height: 78px;
  border-radius: 23px;
  background: rgba(83,223,150,.12);
  display: grid;
  place-items: center;
  font-size: 38px;
  margin-bottom: 20px;
}

.empty strong {
  font-size: 21px;
}

.empty p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
}

.settings-card {
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 22px;
  border: 1px solid var(--border);
  background: var(--card);
  backdrop-filter: blur(20px);
}

.settings-card label {
  display: block;
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 13px;
}

select {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  outline: none;
}

select:focus {
  border-color: var(--accent);
}

/* Liquid Glass нижняя панель */
nav {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);

  width: 235px;
  display: flex;
  gap: 5px;
  padding: 6px;
  border-radius: 25px;

  background: linear-gradient(
    135deg,
    rgba(255,255,255,.22),
    rgba(255,255,255,.05)
  );

  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);

  border: 1px solid rgba(255,255,255,.3);

  box-shadow:
    0 8px 30px rgba(0,0,0,.2),
    inset 0 1px 1px rgba(255,255,255,.4);

  z-index: 100;
  overflow: hidden;
}

nav::before {
  content: "";
  position: absolute;
  top: 0;
  left: 12%;
  width: 76%;
  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.8),
    transparent
  );

  pointer-events: none;
}

nav button {
  position: relative;
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  border-radius: 19px;
  padding: 8px 6px;
  font-size: 11px;
  cursor: pointer;
  transition: transform .25s, background .3s;
}

nav button .symbol {
  display: block;
  font-size: 20px;
  margin-bottom: 4px;
  line-height: 1;
}

nav button.active {
  background: linear-gradient(
    145deg,
    rgba(255,255,255,.35),
    rgba(255,255,255,.08)
  );

  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.5),
    0 3px 12px rgba(0,0,0,.1);

  font-weight: bold;
}

nav button:active {
  transform: scale(.92);
}

body.light nav {
  background: linear-gradient(
    135deg,
    rgba(255,255,255,.8),
    rgba(255,255,255,.35)
  );
  border-color: rgba(255,255,255,.85);
}

body.light nav button.active {
  background: rgba(255,255,255,.65);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<header>
  <div class="logo">MINE<span>MODS</span></div>

  <div class="subtitle" data-i18n="subtitle">
    Моды для Minecraft Bedrock
  </div>
</header>

<!-- Кнопка скачать Minecraft -->
<div class="download-wrap">
  <a
    class="download-minecraft"
    href="https://mcpehub.org/download-mcpe/16143-minecraft-26-52-03.html"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="download-icon">⬇</span>
    <span data-i18n="downloadMinecraft">
      Скачать Minecraft
    </span>
  </a>
</div>

<main>

  <!-- Моды -->
  <section id="mods" class="page active">
    <h1 data-i18n="mods">Моды</h1>

    <div class="empty">
      <div class="empty-icon">📦</div>

      <strong data-i18n="empty">
        Тут пока пусто
      </strong>

      <p data-i18n="soon">
        Скоро здесь появятся моды!
      </p>
    </div>
  </section>

  <!-- Настройки -->
  <section id="settings" class="page">
    <h1 data-i18n="settings">Настройки</h1>

    <div class="settings-card">
      <label for="themeSelect" data-i18n="theme">
        Тема сайта
      </label>

      <select id="themeSelect">
        <option value="dark" data-i18n="dark">
          Тёмная
        </option>

        <option value="light" data-i18n="light">
          Светлая
        </option>
      </select>
    </div>

    <div class="settings-card">
      <label for="langSelect" data-i18n="language">
        Язык
      </label>

      <select id="langSelect">
        <option value="ru">Русский</option>
        <option value="pl">Polski</option>
        <option value="en">English</option>
      </select>
    </div>
  </section>

</main>

<!-- Нижняя стеклянная панель -->
<nav aria-label="Navigation">
  <button
    id="modsBtn"
    class="active"
    type="button"
    onclick="showPage('mods')"
  >
    <span class="symbol">▦</span>
    <span data-i18n="mods">Моды</span>
  </button>

  <button
    id="settingsBtn"
    type="button"
    onclick="showPage('settings')"
  >
    <span class="symbol">⚙</span>
    <span data-i18n="settings">Настройки</span>
  </button>
</nav>

<script>
const translations = {
  ru: {
    subtitle: "Моды для Minecraft Bedrock",
    downloadMinecraft: "Скачать Minecraft",
    mods: "Моды",
    settings: "Настройки",
    empty: "Тут пока пусто",
    soon: "Скоро здесь появятся моды!",
    theme: "Тема сайта",
    language: "Язык",
    dark: "Тёмная",
    light: "Светлая"
  },

  pl: {
    subtitle: "Mody do Minecraft Bedrock",
    downloadMinecraft: "Pobierz Minecraft",
    mods: "Mody",
    settings: "Ustawienia",
    empty: "Na razie jest tu pusto",
    soon: "Wkrótce pojawią się tutaj mody!",
    theme: "Motyw strony",
    language: "Język",
    dark: "Ciemny",
    light: "Jasny"
  },

  en: {
    subtitle: "Mods for Minecraft Bedrock",
    downloadMinecraft: "Download Minecraft",
    mods: "Mods",
    settings: "Settings",
    empty: "Nothing here yet",
    soon: "Mods are coming soon!",
    theme: "Website theme",
    language: "Language",
    dark: "Dark",
    light: "Light"
  }
};

const themeSelect =
  document.getElementById("themeSelect");

const langSelect =
  document.getElementById("langSelect");

function showPage(page) {
  document.querySelectorAll(".page").forEach(el => {
    el.classList.toggle("active", el.id === page);
  });

  document.querySelectorAll("nav button").forEach(el => {
    el.classList.remove("active");
  });

  document.getElementById(page + "Btn")
    .classList.add("active");
}

function setTheme(theme) {
  document.body.classList.toggle(
    "light", theme === "light"
  );

  themeSelect.value = theme;
  localStorage.setItem("theme", theme);
}

function setLanguage(lang) {
  const dict = translations[lang] || translations.ru;

  document.querySelectorAll("[data-i18n]")
    .forEach(el => {
      const key = el.dataset.i18n;

      if (dict[key]) {
        el.textContent = dict[key];
      }
    });

  document.documentElement.lang = lang;
  langSelect.value = lang;
  localStorage.setItem("language", lang);
}

themeSelect.addEventListener("change", () => {
  setTheme(themeSelect.value);
});

langSelect.addEventListener("change", () => {
  setLanguage(langSelect.value);
});

setTheme(localStorage.getItem("theme") || "dark");
setLanguage(localStorage.getItem("language") || "ru");
</script>

</body>
</html>
